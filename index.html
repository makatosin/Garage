<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garage</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Garage">
<meta name="theme-color" content="#eef1f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1219" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: app a colonna singola (max 560px), barra delle sezioni fissa in basso, moduli in un foglio a schermo intero */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#131925; --muted:#5b6577; --line:#d9dfe8; --soft:#e5eaf2;
  --accent:#0f7466; --accent-ink:#ffffff; --accent-soft:#d8efe9;
  --bar:#b9cfe0; --price:#c98a1b; --bad:#c2412d; --warn:#a86d12; --good:#1d7f55;
  --f-display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1219; --surface:#161c26; --ink:#e7ebf2; --muted:#97a1b4; --line:#273041; --soft:#1e2532;
  --accent:#4fd1b8; --accent-ink:#0e1219; --accent-soft:#16332f;
  --bar:#33465c; --price:#e7ae4a; --bad:#ff8f78; --warn:#f0b45a; --good:#5fd39a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1219; --surface:#161c26; --ink:#e7ebf2; --muted:#97a1b4; --line:#273041; --soft:#1e2532;
  --accent:#4fd1b8; --accent-ink:#0e1219; --accent-soft:#16332f;
  --bar:#33465c; --price:#e7ae4a; --bad:#ff8f78; --warn:#f0b45a; --good:#5fd39a; color-scheme:dark}

html{-webkit-text-size-adjust:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(100px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
[hidden]{display:none !important}

/* header */
.top{display:flex;align-items:center;gap:12px}
.veh{flex:1;min-width:0;display:flex;align-items:center;gap:10px;border:0;background:transparent;padding:4px 0;text-align:left}
.avatar{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:18px;flex:none}
.veh b{display:block;font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.veh .chev{color:var(--muted);flex:none}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;padding:0}
.iconbtn svg{width:22px;height:22px}
.iconbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.view{display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.group{display:flex;flex-direction:column;gap:10px}
.hint{color:var(--muted);font-size:13px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted);font-size:14px;white-space:nowrap;min-width:0}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* hero numbers */
.hero{display:flex;flex-direction:column;gap:2px}
.hero .big{font-family:var(--f-num);font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.hero .big small{font-size:18px;font-weight:500;color:var(--muted);letter-spacing:0;margin-left:4px}
.hero .sub{font-family:var(--f-num);color:var(--muted);font-size:17px}
.say{margin:0;font-size:15px;line-height:1.5}
.say b{font-family:var(--f-num);font-weight:600;white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 16px;margin-top:10px}
.facts div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:5px 0;font-size:14px}
.facts span{color:var(--muted)}
.facts b{font-family:var(--f-num);font-weight:500;white-space:nowrap}

/* cost table */
.costs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.costs > div{padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.costs > div + div{border-left:1px solid var(--line)}
.costs .h{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);padding-bottom:6px}
.costs .v{font-family:var(--f-num);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.costs .v.main{font-size:16px;font-weight:600}
.costs .tot{background:var(--accent-soft)}

/* chart */
.chart{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 0 8px;overflow:hidden;touch-action:pan-y}
.chart svg{display:block;width:100%}
.chart .lbl{font:600 11px var(--f-body);fill:var(--muted)}
.chart .ax{font:500 10.5px var(--f-num);fill:var(--muted)}
.chart .foot{display:flex;justify-content:space-between;padding:4px 12px 0;font-family:var(--f-num);font-size:11.5px;color:var(--muted);line-height:1.3}
.chart .foot span:last-child{text-align:right}
.tip{position:absolute;top:8px;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;font-size:12.5px;line-height:1.35;pointer-events:none;white-space:nowrap;font-family:var(--f-num)}
.tip b{font-family:var(--f-body)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);padding:0 12px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

/* list rows */
.ledger{background:var(--surface);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row b{font-weight:600}
.row .l{min-width:0}
.row .l small,.row .r small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .r b{font-weight:600}
.row .l b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid{font-family:var(--f-num);color:var(--muted);font-size:13px;text-align:right}
.row.fuel{grid-template-columns:1fr auto auto}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--soft);color:var(--muted);vertical-align:2px;margin-left:6px;font-family:var(--f-body)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.rem{background:var(--soft)}
.rem .row{grid-template-columns:auto 1fr auto;align-items:center}
.state{width:12px;height:12px;border-radius:50%;background:var(--line)}
.state.scaduto{background:var(--bad)}
.state.presto{background:var(--warn)}
.txt-bad{color:var(--bad) !important}
.txt-warn{color:var(--warn) !important}
.banner{display:flex;gap:10px;align-items:center;border:1px solid var(--bad);color:var(--ink);background:var(--surface);border-radius:12px;padding:10px 12px;text-decoration:none;font-size:14px}
.banner .state{flex:none}
.empty{text-align:center;color:var(--muted);padding:28px 16px;font-size:14px}
.search{font-size:16px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;width:100%;box-sizing:border-box}

/* forms */
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;color:var(--muted);font-weight:500;display:flex;justify-content:space-between;gap:6px}
.field label em{font-style:normal;color:var(--accent);font-family:var(--f-num);font-size:12px;white-space:nowrap}
.input{font-size:16px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%;min-width:0;box-sizing:border-box;-webkit-appearance:none;appearance:none}
select.input{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type="date"].input{min-height:44px}
.input:focus{border-color:var(--accent);outline:none}
.input.numin{font-family:var(--f-num);font-size:18px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.colors button[aria-pressed="true"]{border-color:var(--ink)}

.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:16px}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:15px;padding:11px 14px}
.btn-danger{background:transparent;border:1px solid var(--bad);color:var(--bad);font-size:15px;padding:11px 14px}
.btn-danger.armed{background:var(--bad);color:var(--surface)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.stack{display:flex;flex-direction:column;gap:10px}

/* sheet (dialog a schermo intero) */
dialog#sheet{border:0;padding:0;margin:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;width:100%;max-width:100%;height:100%;max-height:100%;background:var(--bg);color:var(--ink)}
dialog#sheet::backdrop{background:rgba(0,0,0,.4)}
.sheet-in{max-width:560px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(30px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.sheet-h{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.sheet-h h2{text-align:center;font-size:18px}
.summary{display:flex;flex-direction:column;gap:4px}
.summary .big{font-family:var(--f-num);font-size:30px;font-weight:600;letter-spacing:-.02em}
.summary .sub{color:var(--accent);font-weight:600}
.kv{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.kv div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.kv div:first-child{border-top:0}
.kv span{color:var(--muted);font-size:13.5px;text-align:right}
.kv b{font-weight:500;font-family:var(--f-num)}
.kv small{display:block;color:var(--muted);font-size:12.5px;font-family:var(--f-body)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;font-size:11.5px;color:var(--muted);text-decoration:none;font-weight:500}
.tabs a svg{width:23px;height:23px}
.tabs a[aria-current="page"]{color:var(--accent)}
.fabslot{display:grid;place-items:center}
.tabs a{white-space:nowrap}
.tabs .ln{display:none}
@media (max-width:370px){.tabs .lw{display:none}.tabs .ln{display:inline}}
.badge.presto{background:var(--warn)}
.fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:0}
.fab svg{width:28px;height:28px}
.fab:active{transform:scale(.95)}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px;box-sizing:border-box}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:1000;max-width:calc(100% - 32px);text-align:center}
.welcome{display:flex;flex-direction:column;gap:16px;padding-top:30px}
.welcome .logo{width:64px;height:64px;border-radius:18px}
.welcome h1{font-family:var(--f-display);font-size:32px;margin:0;letter-spacing:-.02em}
.welcome p{margin:0;color:var(--muted)}
@media (max-width:370px){.seg button{font-size:12.5px;padding:8px 2px}.hero .big{font-size:34px}.costs > div{padding:10px 7px}.costs .h{font-size:10.5px;letter-spacing:0}.costs .v{font-size:11.5px;letter-spacing:-.03em}.costs .v.main{font-size:12.5px}.facts{gap:4px 12px}.facts div{font-size:13px}.kv div{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<main class="app">
  <section id="v-welcome" class="welcome" hidden>
    <img class="logo" src="icon-192.png" alt="">
    <h1>Garage</h1>
    <p>Tieni il conto di rifornimenti, consumi, manutenzioni e viaggi delle tue auto.</p>
    <p class="hint" id="wStato" hidden></p>
    <button class="btn btn-primary" id="wAdd" type="button">Aggiungi la prima auto</button>
    <button class="btn btn-ghost" id="wSync" type="button">Collega il Foglio Google</button>
    <button class="btn btn-ghost" id="wLink" type="button">Importa da un link</button>
    <button class="btn btn-ghost" id="wImport" type="button">Ripristina un backup</button>
    <button class="btn btn-ghost" id="wDemo" type="button">Prova con dati di esempio</button>
  </section>

  <header class="top" id="topbar" hidden>
    <button class="veh" id="vehBtn" type="button" aria-label="Cambia veicolo">
      <span class="avatar" id="vehAv"></span>
      <span style="min-width:0"><b id="vehName"></b><small id="vehSub"></small></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
  </header>

  <section id="v-stat" class="view" hidden></section>
  <section id="v-carb" class="view" hidden></section>
  <section id="v-spese" class="view" hidden></section>
  <section id="v-viaggi" class="view" hidden></section>
  <section id="v-altro" class="view" hidden></section>
</main>

<nav class="tabs" aria-label="Sezioni" hidden><div class="in">
  <a href="#stat" data-tab="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M7 16v-4M11 16V8M15 16v-6M19 16V5"/></svg>Statistiche</a>
  <a href="#carb" data-tab="carb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v15M3 20h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"/></svg>Carburante</a>
  <div class="fabslot"><button class="fab" id="addBtn" type="button" aria-label="Nuovo rifornimento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <a href="#spese" data-tab="spese"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L4 16.8V20h3.2l5.3-5.3a4 4 0 0 0 5.2-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg><span class="lw">Manutenzione</span><span class="ln">Manut.</span><span class="badge" id="badge" hidden></span></a>
  <a href="#altro" data-tab="altro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>Altro</a>
</div></nav>

<dialog id="sheet"><div class="sheet-in">
  <div class="sheet-h">
    <button class="iconbtn" id="shClose" type="button" aria-label="Chiudi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <h2 id="shTitle"></h2>
    <button class="iconbtn primary" id="shSave" type="button" aria-label="Salva"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></button>
  </div>
  <div id="shBody" class="stack" style="gap:18px"></div>
</div></dialog>
<input type="file" id="fileIn" accept=".csv,.json,text/csv,application/json,text/plain" hidden>
<div id="toast" role="status" hidden></div>

<script>
/* ================= utilità ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF = {};
const fmt = (v, d = 0, dm = d) => { if (v == null || !isFinite(v)) return '—'; const k = d + '-' + dm; return (NF[k] || (NF[k] = new Intl.NumberFormat('it-IT', {minimumFractionDigits:d, maximumFractionDigits:dm}))).format(v); };
const eur = v => fmt(v, 2) + ' €';
const pad = n => String(n).padStart(2, '0');
const isoDay = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => isoDay(new Date());
const toD = iso => { const [y, m, d] = String(iso).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const days = (a, b) => Math.round((toD(b) - toD(a)) / 864e5);
const addMonths = (iso, m) => { const d = toD(iso); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + m); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return isoDay(d); };
const addDays = (iso, n) => { const d = toD(iso); d.setDate(d.getDate() + n); return isoDay(d); };
const fDate = iso => iso ? toD(iso).toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'numeric'}) : '—';
const fShort = iso => iso ? toD(iso).toLocaleDateString('it-IT', {day:'numeric', month:'short', year:'2-digit'}) : '—';
function durata(n){
  n = Math.abs(n);
  if (n < 1) return 'oggi';
  if (n < 14) return n === 1 ? '1 giorno' : n + ' giorni';
  if (n < 60) return Math.round(n / 7) + ' settimane';

// unione a tre vie per record (id): se un record è cambiato qui rispetto all'ultima sincronizzazione vince questo telefono, altrimenti il foglio
function unisci(base, loc, rem){
  const out = {};
  COLL.forEach(k => {
    const B = new Map(((base && base[k]) || []).map(x => [x.id, JSON.stringify(x)]));
    const L = new Map((loc[k] || []).map(x => [x.id, x])), R = new Map(((rem && rem[k]) || []).map(x => [x.id, x]));
    out[k] = [];
    new Set([...R.keys(), ...L.keys()]).forEach(id => {
      const l = L.get(id), cambiato = base ? (l ? JSON.stringify(l) : undefined) !== B.get(id) : !!l;
      const x = cambiato ? l : R.get(id);
      if (x) out[k].push(x);

}
async function api(action, payload, lk = SY){
  let r;

  catch(e){ throw {net:true}; }
  let j; try { j = await r.json(); } catch(e){ throw {net:true}; }
  if (!j.ok) throw {server:true, conflict:!!j.conflict, message:j.error || 'errore'};
  return j.data;
}
let syncing = false, ancora = false, syncT = null;

async function sincronizza(manuale){
  if (!SY.url) return false;

  if (sheet.open && !manuale){ programmaSync(4000); return false; }
  syncing = true; ancora = false; statoSync();
  let ok = false;
  try {
    for (let i = 0; i < 4; i++){
      const rem = await api('load');
      const inizio = datiSync(S);
      const m = unisci(SY.base, inizio, rem.state);
      let rev = rem.rev;
      if (JSON.stringify(m) !== JSON.stringify(datiSync(rem.state))){
        try { rev = (await api('save', {rev:rem.rev, state:m})).rev; }
        catch(e){ if (e.conflict) continue; throw e; }
      }
      // le modifiche fatte mentre aspettavo il foglio restano
      const ora = datiSync(S), fin = unisci(inizio, ora, m);
      const cambia = JSON.stringify(fin) !== JSON.stringify(ora);
      COLL.forEach(k => S[k] = fin[k]);
      if (!S.veicoli.some(v => v.id === S.attivo)) S.attivo = S.veicoli[0] ? S.veicoli[0].id : null;
      SY.base = JSON.parse(JSON.stringify(m)); SY.rev = rev; SY.ultimo = Date.now(); SY.errore = null; salvaSY(); salvaLocale();
      if (JSON.stringify(fin) !== JSON.stringify(m)) ancora = true;
      if (cambia && !sheet.open) show(tab);
      ok = true; break;
    }
  } catch(e){
    SY.errore = e && e.server ? e.message : 'foglio non raggiungibile'; salvaSY();
    if (e && e.net) programmaSync(30000);
    if (manuale) flash(e && e.server ? 'Errore dal foglio: ' + e.message : 'Non riesco a raggiungere il foglio');
  } finally {
    syncing = false; statoSync();
    if (ancora) programmaSync(500);

  return ok;
}

function kmAttuali(vid){

/* Consumo "da pieno a pieno": tra due pieni si sommano i litri di tutti i rifornimenti (anche parziali).
   Se un rifornimento è segnato come "precedente saltato", quel tratto non si può calcolare. */
function segmenti(fuel){
  const seg = {}; let last = -1, litri = 0, costo = 0, rotto = false;
  fuel.forEach((f, i) => {
    f._dist = i > 0 ? f.km - fuel[i - 1].km : null;
    if (f.mancato) rotto = true;
    litri += f.litri || 0; costo += f.totale || 0;
    if (f.pieno){
      if (last >= 0 && !rotto){
        const dist = f.km - fuel[last].km;
        if (dist > 0 && litri > 0) seg[f.id] = {dist, litri, costo, l100: litri / dist * 100, giorni: days(fuel[last].data, f.data)};
      }
      last = i; litri = 0; costo = 0; rotto = false;
    }
  });
  return seg;
}

function statistiche(vid, da, a = '9999-12-31'){
  const vv = veicolo(vid), princ = carbDi(vv)[0];
  const fuelAll = rifDi(vid), chain = catena(vid), seg = segmenti(chain);
  const dentro = d => d >= da && d <= a;
  const tutti = fuelAll.filter(f => dentro(f.data));            // tutti i rifornimenti del periodo (per i costi)
  const fuel = chain.filter(f => dentro(f.data));               // quelli con i km del carburante principale (grafico e consumi)
  const princP = tutti.filter(f => tipoRif(f, vv) === princ);   // carburante principale, anche senza km (litri e prezzo)
  const costoSec = tutti.filter(f => tipoRif(f, vv) !== princ).reduce((s, f) => s + (f.totale || 0), 0);
  const segs = fuel.map(f => seg[f.id]).filter(Boolean);
  const spese = S.spese.filter(s => s.v === vid && s.fatto !== false && s.data && dentro(s.data));
  // punti (data, km) di tutto ciò che ha un contachilometri
  const punti = [];
  S.rif.forEach(r => r.v === vid && r.km != null && r.km >= 0 && punti.push([r.data, r.km]));
  if (vv && vv.lettura && vv.lettura.km > 0) punti.push([vv.lettura.data, vv.lettura.km]);
  S.spese.forEach(r => r.v === vid && r.data && r.km > 0 && punti.push([r.data, r.km]));
  S.viaggi.forEach(r => { if (r.v !== vid) return; if (r.km0 > 0) punti.push([r.dal, r.km0]); if (r.al && r.km1 > 0) punti.push([r.al, r.km1]); });
  punti.sort((x, y) => x[0].localeCompare(y[0]) || x[1] - y[1]);
  const pIn = punti.filter(p => dentro(p[0])), prima = punti.filter(p => p[0] < da);
  let km = 0, startDate = null;
  if (pIn.length){
    const maxIn = Math.max(...pIn.map(p => p[1]));
    const base = prima.length ? Math.max(...prima.map(p => p[1])) : Math.min(...pIn.map(p => p[1]));
    km = Math.max(0, maxIn - base);
  }
  const tuttiData = [...tutti.map(f => f.data), ...spese.map(s => s.data), ...pIn.map(p => p[0])].sort();
  if (prima.length || S.spese.some(s => s.v === vid && s.data && s.data < da) || fuelAll.some(f => f.data < da)) startDate = da;
  else startDate = tuttiData[0] || today();
  const fine = a < today() ? a : today();
  const giorni = Math.max(1, days(startDate, fine));
  const costoCarb = tutti.reduce((s, f) => s + (f.totale || 0), 0);
  const litri = princP.reduce((s, f) => s + (f.litri || 0), 0), costoPrinc = princP.reduce((s, f) => s + (f.totale || 0), 0);
  const costoSpese = spese.reduce((s, x) => s + (x.importo || 0), 0);
  const perGruppo = {manutenzione:0, documenti:0};
  spese.forEach(x => perGruppo[tipoVoce(x)] += x.importo || 0);
  const sd = segs.reduce((s, x) => s + x.dist, 0), sl = segs.reduce((s, x) => s + x.litri, 0);
  const l100 = sd > 0 ? sl / sd * 100 : null;
  const l100s = segs.map(s => s.l100);
  const prezzi = princP.filter(f => f.prezzo > 0).map(f => f.prezzo);
  const segCosto = segs.reduce((s, x) => s + x.costo, 0), segGiorni = segs.reduce((s, x) => s + x.giorni, 0);
  const pochi = giorni < 7; // con meno di una settimana di dati i valori al giorno non hanno senso
  // il carburante secondario (es. benzina su un'auto a GPL) si aggiunge in proporzione ai km e ai giorni
  const carb100 = sd > 0 ? segCosto / sd * 100 + (km > 0 ? costoSec / km * 100 : 0) : km > 0 && fuel.length > 1 ? costoCarb / km * 100 : null;
  const carbG = segGiorni >= 7 ? segCosto / segGiorni + (pochi ? 0 : costoSec / giorni) : pochi ? null : costoCarb / giorni;
  const spese100 = km > 0 ? costoSpese / km * 100 : null, speseG = pochi ? null : costoSpese / giorni;
  return {
    carb100, carbG, spese100, speseG, pochi,
    tot100: carb100 != null && spese100 != null ? carb100 + spese100 : carb100,
    totG: carbG != null && speseG != null ? carbG + speseG : null,
    fuel, tutti, fuelAll, seg, segs, spese, km, giorni, costoCarb, costoSec, costoPrinc, princ, litri, costoSpese, perGruppo, l100,
    kml: l100 ? 100 / l100 : null,
    prezzoMedio: litri > 0 ? costoPrinc / litri : null,
    kmPieno: segs.length ? sd / segs.length : null,
    maxPieno: segs.length ? Math.max(...segs.map(s => s.dist)) : null,
    best: l100s.length ? Math.min(...l100s) : null, worst: l100s.length ? Math.max(...l100s) : null,
    pMin: prezzi.length ? Math.min(...prezzi) : null, pMax: prezzi.length ? Math.max(...prezzi) : null,

}

/* Scadenze: per ogni voce (stesso nome) conta quella da fare, se c'è, altrimenti l'ultima fatta */
function promemoria(vid){
  const gruppi = {};
  S.spese.filter(s => s.v === vid).forEach(s => { const k = s.titolo.trim().toLowerCase(); (gruppi[k] = gruppi[k] || []).push(s); });
  const km = kmAttuali(vid);
  const st = statistiche(vid, addMonths(today(), -12));
  const kmG = st.kmGiorno > 0 && !st.pochi ? st.kmGiorno : null;
  const out = [];
  Object.values(gruppi).forEach(g => {
    const s = g.find(x => x.fatto === false) || g.filter(x => x.data).sort((a, b) => b.data.localeCompare(a.data) || (b.km || 0) - (a.km || 0))[0];
    if (!s) return;
    const {data: dataDue, km: kmDue} = scadenzaDi(s);
    if (!dataDue && !kmDue) return;
    const ggData = dataDue ? days(today(), dataDue) : null;
    const kmMancano = kmDue ? kmDue - km : null;
    const ggKm = kmMancano != null && kmG ? Math.round(kmMancano / kmG) : null;
    const scaduto = (ggData != null && ggData < 0) || (kmMancano != null && kmMancano <= 0);
    const gg = [ggData, ggKm].filter(x => x != null);
    const minGg = gg.length ? Math.min(...gg) : null;
    const presto = !scaduto && ((minGg != null && minGg <= PREAVVISO_GG) || (kmMancano != null && kmMancano <= PREAVVISO_KM));
    const parti = [];
    if (scaduto){
      if (kmMancano != null && kmMancano <= 0) parti.push(fmt(-kmMancano) + ' km');
      if (ggData != null && ggData < 0) parti.push(durata(-ggData));
    } else {
      if (ggData === 0) parti.push('oggi');
      else if (ggData != null) parti.push(durata(ggData));
      if (kmMancano != null) parti.push(fmt(kmMancano) + ' km');
    }
    const testo = scaduto ? 'Scaduto da ' + parti.join(', ') : ggData === 0 ? 'Scade oggi' : 'Tra ' + parti.join(' o ');
    const quando = dataDue && (ggKm == null || ggData <= ggKm) ? {data:dataDue, stima:false} : ggKm != null ? {data:addDays(today(), ggKm), stima:true} : {data:dataDue, stima:false};
    out.push({s, dataDue, kmDue, scaduto, presto, testo, quando, ord: scaduto ? -1e9 + (minGg ?? 0) : (minGg ?? 1e6)});
  });
  return out.sort((a, b) => a.ord - b.ord);
}

const field = (id, label, value = '', opt = {}) => `<div class="field${opt.full ? ' full' : ''}"><label for="${id}">${esc(label)}<em id="${id}-h">${opt.hint || ''}</em></label><input class="input${opt.num ? ' numin' : ''}" id="${id}" ${opt.type ? `type="${opt.type}"` : ''} ${opt.num ? `inputmode="${opt.int ? 'numeric' : 'decimal'}"` : ''} value="${esc(value)}" placeholder="${esc(opt.ph || '')}" ${opt.list ? `list="${opt.list}"` : ''} autocomplete="off"></div>`;
const select = (id, label, options, value, full) => `<div class="field${full ? ' full' : ''}"><label for="${id}">${esc(label)}</label><select class="input" id="${id}">${options.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}"${v === value ? ' selected' : ''}>${esc(t)}</option>`; }).join('')}</select></div>`;
const val = id => $('#' + id).value.trim();

/* ---------- rifornimento ---------- */
// prezzo proposto per un carburante: media degli ultimi 3 rifornimenti, altrimenti il prezzo di riferimento del veicolo
function prezzoProposto(v, carb, escludi){
  const rec = S.rif.filter(f => f.v === v.id && f.id !== escludi && tipoRif(f, v) === carb && f.prezzo > 0).sort((a, b) => a.data.localeCompare(b.data)).slice(-3);
  if (rec.length) return Math.round(rec.reduce((a, f) => a + f.prezzo, 0) / rec.length * 1000) / 1000;
  return v.prezziRif && v.prezziRif[carb] || null;
}
function formRif(r, preset){
  const v = V(), carbs = carbDi(v), princ = carbs[0];
  const nuovo = !r;
  let carb = (preset && preset.carb) || (r ? tipoRif(r, v) : princ);
  const u = unitaCarb(carb), uLab = u === 'l' ? 'litro' : u;
  const isPrinc = carb === princ;
  const chain = catena(v.id);
  const prev = chain.filter(f => !r || f.id !== r.id);
  const p0 = nuovo || r.km == null ? prev[prev.length - 1] : prev.filter(f => f.km <= r.km).pop();
  const baseKm = p0 ? p0.km : (r && r.km != null ? r.km : kmAttuali(v.id)) || 0; // primo pieno: parte dal contachilometri attuale
  r = r || {id:newId(), v:v.id, data:today(), km:null, litri:null, prezzo:null, totale:null, pieno:true, mancato:false, luogo:'', nota:''};
  const prezzo0 = nuovo ? prezzoProposto(v, carb) : r.prezzo;
  const tot0 = preset && preset.totale != null ? preset.totale : r.totale;
  const trip0 = !nuovo && r.km != null && isPrinc && p0 ? r.km - baseKm : null;
  const seg = isPrinc && r.km != null ? segmenti(chain)[r.id] : null;
  let top = '';
  if (!nuovo){
    top = `<div class="summary"><div class="big">${seg ? fmt(seg.l100, 2) + ' ' + u + '/100 km' : esc(carb)}</div>
      <div class="sub">${esc(fDate(r.data))} · ${fa(r.data)}</div></div>
      ${seg ? `<div class="kv"><div><span>tratto</span><b>${fmt(seg.dist)} km in ${durata(seg.giorni)}<small>${fmt(seg.dist / Math.max(1, seg.giorni))} km/giorno · ${fmt(100 / seg.l100, 2)} km/${u}</small></b></div>
        <div><span>costo</span><b>${fmt(seg.costo / seg.dist * 100, 2)} €/100 km</b></div></div>` : ''}
      <h3>Modifica</h3>`;
  }
  const html = `${top}
    ${carbs.length > 1 ? `<div class="seg" id="fCarb">${carbs.map(c => `<button type="button" data-c="${esc(c)}" aria-pressed="${c === carb}">${esc(c)}</button>`).join('')}</div>` : ''}
    <div class="fields">
      ${field('fTot', 'Quanto hai pagato (€)', inNum(tot0, 2), {num:1, ph:'0,00', full:1})}
      ${isPrinc ? field('fTrip', p0 ? `Km fatti dall'ultimo pieno${carbs.length > 1 ? ' di ' + princ : ''}` : 'Km fatti (primo pieno: lascia vuoto)', trip0 != null && (p0 || trip0 > 0) ? trip0 : '', {num:1, int:1, ph: p0 ? 'es. 326' : '0', full:1}) : ''}
      ${field('fPrezzo', '€/' + uLab, inNum(prezzo0), {num:1, ph:'0,000', full:1, hint: nuovo && prezzo0 ? 'prezzo medio recente' : ''})}
    </div>
    <p class="hint" style="margin-top:-8px">${isPrinc ? 'Il prezzo è già compilato con la media recente: cambialo solo se oggi era diverso (es. in autostrada).' : `Per la ${esc(carb.toLowerCase())} bastano euro e prezzo: i consumi si calcolano sul ${esc(princ)}.`}</p>
    ${isPrinc ? `<div class="seg" id="fPieno"><button type="button" data-p="1" aria-pressed="${r.pieno}">Pieno</button><button type="button" data-p="0" aria-pressed="${!r.pieno}">Parziale</button></div>` : ''}
    <button class="btn btn-ghost" id="fMoreBtn" type="button">Data e altri dati <span class="hint" id="fMoreSum"></span></button>
    <div id="fMore" class="stack" style="gap:16px" hidden>
      <div class="fields">
        ${field('fData', 'Data', r.data, {type:'date'})}
        ${field('fKm', 'Contachilometri totale', r.km != null ? r.km : '', {num:1, int:1, ph: isPrinc ? 'calcolato da solo' : 'facoltativo'})}
        ${field('fLitri', u === 'l' ? 'Litri' : u, inNum(r.litri), {num:1, ph:'calcolati da soli'})}
        ${field('fLuogo', 'Distributore', r.luogo, {list:'dlLuoghi', ph:'es. Q8'})}
        ${field('fNota', 'Nota', r.nota, {full:1})}
      </div>
      ${isPrinc ? `<label class="check"><input type="checkbox" id="fMancato" ${r.mancato ? 'checked' : ''}><span>Ho saltato il rifornimento precedente (non l'ho registrato): il consumo di questo tratto non verrà calcolato.</span></label>` : ''}
    </div>
    <datalist id="dlLuoghi">${[...new Set(S.rif.map(x => x.luogo).filter(Boolean))].map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    ${nuovo ? '' : '<button class="btn btn-danger" id="fDel" type="button">Elimina rifornimento</button>'}`;
  let pieno = isPrinc ? r.pieno : true, tripToccato = false;
  const mancato = () => !!($('#fMancato') && $('#fMancato').checked);
  openSheet(nuovo ? 'Nuovo rifornimento' : 'Rifornimento', html, () => {
    let km = num(val('fKm'), true); const litri = num(val('fLitri')), prezzo = num(val('fPrezzo')), tot = num(val('fTot'));
    if (isPrinc && !p0 && !(km > 0)) km = baseKm; // il primo pieno fa da punto di partenza
    if (!(tot > 0)) { flash('Scrivi quanto hai pagato'); return false; }
    if (isPrinc && (!(km >= 0) || (p0 && km <= baseKm))) { flash('Scrivi i km fatti dall\'ultimo pieno'); return false; }
    if (!(litri > 0)) { flash('Manca il prezzo al ' + uLab); return false; }
    if (!val('fData')) { flash('Manca la data'); return false; }
    const vecchioKm = r.km;
    Object.assign(r, {carb, data:val('fData'), km: km >= 0 ? km : null, litri, prezzo: prezzo > 0 ? prezzo : tot / litri, totale:tot, pieno, mancato:mancato(), luogo:val('fLuogo'), nota:val('fNota')});
    // se hai corretto i km di un pieno vecchio, quelli successivi si spostano insieme (i loro km parziali restano uguali)
    if (!nuovo && isPrinc && tripToccato && vecchioKm != null && km !== vecchioKm){
      const d = km - vecchioKm;
      S.rif.forEach(f => { if (f.v === r.v && f.id !== r.id && f.km != null && f.km > vecchioKm && tipoRif(f, v) === princ) f.km += d; });
    }
    if (nuovo) S.rif.push(r);
    save(); flash(nuovo ? 'Rifornimento salvato' : 'Modifiche salvate');
  });
  if (carbs.length > 1) document.querySelectorAll('#fCarb button').forEach(b => b.onclick = () => {
    if (b.dataset.c === carb) return;
    if (nuovo) formRif(null, {carb:b.dataset.c, totale:num(val('fTot'))});
    else formRif(r, {carb:b.dataset.c, totale:num(val('fTot'))});
  });
  const more = () => { $('#fMore').hidden = false; $('#fMoreBtn').hidden = true; };
  $('#fMoreBtn').onclick = more;
  if (!nuovo && (r.luogo || r.nota || r.mancato)) more();
  // litri, prezzo e totale: si ricalcola quello toccato meno di recente (all'inizio i litri)
  const ord = ['fLitri', 'fPrezzo', 'fTot'];
  const ricalcola = id => {
    ord.splice(ord.indexOf(id), 1); ord.push(id);
    const L = num(val('fLitri')), P = num(val('fPrezzo')), T = num(val('fTot'));
    const t = ord[0];
    if (t === 'fLitri' && P > 0 && T > 0) $('#fLitri').value = inNum(T / P);
    if (t === 'fPrezzo' && L > 0 && T > 0) $('#fPrezzo').value = inNum(T / L);
    if (t === 'fTot' && L > 0 && P > 0) $('#fTot').value = inNum(L * P, 2);
    anteprima();
  };
  const anteprima = () => {
    const L = num(val('fLitri'));
    $('#fTot-h').textContent = L > 0 ? fmt(L, 2) + ' ' + u : '';
    $('#fMoreSum').textContent = '· ' + (val('fData') === today() ? 'oggi' : fDate(val('fData')));
    if (!isPrinc) return;
    let km = num(val('fKm'), true); if (!p0 && !(km > 0)) km = baseKm;
    const bozza = {...r, km, litri:L, totale:num(val('fTot')), pieno, mancato:mancato(), data:val('fData') || today()};
    const lista = [...prev, bozza].filter(f => f.km >= 0).sort((a, b) => a.km - b.km || a.data.localeCompare(b.data));
    const sg = km >= 0 && L > 0 ? segmenti(lista)[bozza.id] : null;

  if ($('#fTrip')) $('#fTrip').addEventListener('input', () => { tripToccato = true; const t = num(val('fTrip'), true); $('#fKm').value = t > 0 ? baseKm + t : ''; anteprima(); });
  $('#fKm').addEventListener('input', () => { if (!$('#fTrip')) return; const k = num(val('fKm'), true); $('#fTrip').value = k > 0 ? k - baseKm : ''; anteprima(); });
  ['fLitri', 'fPrezzo', 'fTot'].forEach(id => $('#' + id).addEventListener('input', () => ricalcola(id)));
  if ($('#fMancato')) $('#fMancato').addEventListener('change', anteprima);
  $('#fData').addEventListener('change', anteprima);
  document.querySelectorAll('#fPieno button').forEach(b => b.onclick = () => { pieno = b.dataset.p === '1'; document.querySelectorAll('#fPieno button').forEach(x => x.setAttribute('aria-pressed', x === b)); anteprima(); });
  if (tot0 > 0 && prezzo0 > 0 && !(r.litri > 0)) ricalcola('fTot'); else anteprima();
  if (!nuovo) armDelete($('#fDel'), 'Tocca di nuovo per eliminare', () => { S.rif = S.rif.filter(x => x.id !== r.id); save(); flash('Rifornimento eliminato'); });
}

/* ---------- manutenzione e documenti ---------- */
// Una "voce" è un intervento fatto (con data) o da fare (senza data), con una scadenza:
// fissa (entro una data e/o dei km) oppure a ripetizione (ogni N mesi e/o N km dall'ultima volta).
const SUGGERIMENTI = {

  documenti: ['Assicurazione', 'Bollo', 'Revisione', 'Patente']
};
const PREAVVISO_GG = 30, PREAVVISO_KM = 1000;
function formVoce(s, preset){
  const v = V(); const nuovo = !s;
  const orig = s;
  s = s ? {...s, ...(preset || {})} : {id:newId(), v:v.id, tipo:'manutenzione', titolo:'', dettagli:'', fatto:true, data:today(), km:kmAttuali(v.id) || null, importo:null, nota:'', rip:null, scad:null, ...(preset || {})};
  let tipo = s.tipo || 'manutenzione', fatto = s.fatto !== false;
  const correlate = nuovo ? [] : speseDi(v.id).filter(x => x.id !== s.id && x.fatto !== false && x.titolo.trim().toLowerCase() === s.titolo.trim().toLowerCase());
  const titoli = [...new Set([...S.spese.filter(x => (x.tipo || 'manutenzione') === tipo).map(x => x.titolo), ...SUGGERIMENTI[tipo]].filter(Boolean))];
  const html = `
    <div class="seg" id="vTipo"><button type="button" data-t="manutenzione" aria-pressed="${tipo === 'manutenzione'}">Manutenzione</button><button type="button" data-t="documenti" aria-pressed="${tipo === 'documenti'}">Documenti</button></div>
    <div class="fields">
      ${field('sTit', 'Cosa', s.titolo, {full:1, list:'dlTitoli', ph: tipo === 'documenti' ? 'es. Assicurazione' : 'es. Cambio olio'})}
      ${field('sDet', 'Dettagli', s.dettagli || '', {full:1, ph: tipo === 'documenti' ? 'es. compagnia, numero polizza' : 'es. olio 5W-40, 3,5 litri'})}
    </div>
    <div class="seg" id="vFatto"><button type="button" data-f="1" aria-pressed="${fatto}">Fatto</button><button type="button" data-f="0" aria-pressed="${!fatto}">Da fare</button></div>
    <div class="fields" id="vQuando">
      ${field('sData', 'Quando l\'hai fatto', s.data || today(), {type:'date'})}
      ${field('sKm', 'A quanti km', s.km || '', {num:1, int:1, ph:'km'})}
      ${field('sImp', 'Costo € (facoltativo)', inNum(s.importo, 2), {num:1, ph:'0,00', full:1})}
    </div>
    <div class="group"><h3>Scadenza</h3>
      <p class="hint" id="scadHint"></p>
      <div class="fields">
        ${field('sScadD', 'Entro il', s.scad && s.scad.data || '', {type:'date'})}
        ${field('sScadK', 'o entro i km', s.scad && s.scad.km || '', {num:1, int:1, ph:'es. 150000'})}
      </div>
      <div class="fields" id="vRip">
        ${field('sMesi', 'Poi ripeti ogni (mesi)', s.rip && s.rip.mesi || '', {num:1, int:1, ph:'es. 12'})}
        ${field('sRkm', 'o ogni (km)', s.rip && s.rip.km || '', {num:1, int:1, ph:'es. 15000'})}
      </div>
      <p class="say" id="scadPrev"></p>
    </div>
    ${field('sNota', 'Nota', s.nota || '', {full:1})}
    <datalist id="dlTitoli">${titoli.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
    ${correlate.length ? `<div class="group"><h3>Volte precedenti</h3><div class="ledger">${correlate.slice(0, 6).map(x => `<div class="row"><div class="l"><b>${esc(fDate(x.data))}</b><small>${x.km ? fmt(x.km) + ' km' : ''}${x.dettagli ? ' · ' + esc(x.dettagli) : ''}</small></div><div class="r">${x.importo ? eur(x.importo) : ''}</div></div>`).join('')}</div></div>` : ''}
    ${nuovo ? '' : '<button class="btn btn-danger" id="sDel" type="button">Elimina</button>'}`;
  openSheet(nuovo ? (tipo === 'documenti' ? 'Nuovo documento' : 'Nuova manutenzione') : s.titolo, html, () => {
    const titolo = val('sTit'), imp = num(val('sImp')), km = num(val('sKm'), true), mesi = num(val('sMesi'), true), rkm = num(val('sRkm'), true), sk = num(val('sScadK'), true), sd = val('sScadD');
    if (!titolo) { flash('Scrivi cosa hai fatto o devi fare'); return false; }
    if (fatto && !val('sData')) { flash('Manca la data'); return false; }
    if (!fatto && !sd && !(sk > 0)) { flash('Per una cosa da fare serve una scadenza (data o km)'); return false; }
    if (fatto && rkm > 0 && !(km > 0)) { flash('Per ripetere a km serve sapere a quanti km l\'hai fatto'); return false; }
    Object.assign(s, {tipo, titolo, dettagli:val('sDet'), fatto, data: fatto ? val('sData') : null, km: fatto && km > 0 ? km : null, importo: fatto && imp > 0 ? imp : 0,
      nota:val('sNota'), scad: sd || sk > 0 ? {data: sd || null, km: sk > 0 ? sk : null} : null,
      rip: (mesi > 0 || rkm > 0) ? {mesi: mesi > 0 ? mesi : null, km: rkm > 0 ? rkm : null} : null});
    delete s.cat; delete s.luogo; if (orig) { delete orig.cat; delete orig.luogo; }
    if (nuovo) S.spese.push(s); else Object.assign(orig, s);
    save(); flash('Salvato');
  });
  const aggiorna = () => {
    $('#vQuando').hidden = !fatto;
    $('#scadHint').textContent = fatto
      ? 'Metti una data o dei km precisi, oppure ogni quanto va rifatto. Ti avviso un mese prima (o 1.000 km prima).'
      : 'Entro quando va fatto? Ti avviso un mese prima (o 1.000 km prima).';
    // anteprima della prossima scadenza
    const bozza = {fatto, data: fatto ? val('sData') : null, km: num(val('sKm'), true), scad:{data: val('sScadD') || null, km: num(val('sScadK'), true) || null}, rip:{mesi: num(val('sMesi'), true) || null, km: num(val('sRkm'), true) || null}};

  });
  ['sData', 'sKm', 'sScadD', 'sScadK', 'sMesi', 'sRkm'].forEach(id => $('#' + id).addEventListener('input', aggiorna));

}

// prossima scadenza di una voce: per una cosa da fare la scadenza fissa; per una fatta la scadenza fissa se c'è, altrimenti la ripetizione
function scadenzaDi(s){
  const fissa = s.scad && (s.scad.data || s.scad.km > 0);
  if (s.fatto === false || fissa) return {data: s.scad && s.scad.data || null, km: s.scad && s.scad.km > 0 ? s.scad.km : null};
  const r = s.rip || {};
  return {data: r.mesi > 0 && s.data ? addMonths(s.data, r.mesi) : null, km: r.km > 0 && s.km > 0 ? s.km + r.km : null};
}

  armDelete($('#pStop'), 'Tocca di nuovo per togliere l\'avviso', () => { s.rip = null; s.scad = null; if (s.fatto === false) S.spese = S.spese.filter(x => x.id !== s.id); save(); flash('Avviso tolto'); });
}

/* ---------- viaggio ---------- */
function formViaggio(t){

// km di un viaggio: dai contachilometri se ci sono, altrimenti da rifornimenti e spese nelle date del viaggio
function kmViaggio(t){
  const kmFine = t.km1 || (t.al ? null : kmAttuali(t.v));
  if (t.km0 != null && kmFine) return {km: Math.max(0, kmFine - t.km0), kmFine};
  return {km: statistiche(t.v, t.dal, t.al || today()).km, kmFine};
}

/* grafico: sopra il prezzo al litro, sotto il consumo di ogni pieno (barre) con media mobile */
function disegnaGrafico(box, st, u){
  const pts = st.fuel;
  const grp = $('#chartGroup'); if (grp) grp.hidden = pts.length < 2;
  if (pts.length < 2){ box.innerHTML = ''; return; }
  box.innerHTML = `<div class="chart"><div class="legend"><span><i style="background:var(--price)"></i>€/${u}</span><span><i style="background:var(--bar);height:8px"></i>${u}/100 km</span><span><i style="background:var(--accent)"></i>media</span></div><div class="cv"></div><div class="foot"><span>${fmt(pts[0].km)} km<br>${fShort(pts[0].data)}</span><span>${fmt(pts[pts.length - 1].km)} km<br>${fShort(pts[pts.length - 1].data)}</span></div><div class="tip" hidden></div></div>`;
  const cv = box.querySelector('.cv'), tip = box.querySelector('.tip');
  const W = Math.max(260, cv.clientWidth || 340), R = 46, L = 10, pw = W - R - L;
  const H1 = 64, G = 18, H2 = 140, H = H1 + G + H2 + 4;
  const n = pts.length, X = i => L + (n === 1 ? pw / 2 : i * pw / (n - 1));
  const pr = pts.map(p => p.prezzo || null);
  const pv = pr.filter(Boolean), pmin = Math.min(...pv), pmax = Math.max(...pv), pspan = (pmax - pmin) || pmax * .05 || 1;
  const PY = y => 14 + (1 - (y - pmin) / pspan) * (H1 - 18);
  const cons = pts.map(p => st.seg[p.id] ? st.seg[p.id].l100 : null);
  const cv2 = cons.filter(x => x != null);
  let svg = '';
  // prezzo
  let path = '', area = '';
  pr.forEach((y, i) => { if (y == null) return; path += (path ? 'L' : 'M') + X(i).toFixed(1) + ' ' + PY(y).toFixed(1); });
  if (path){ area = path + `L${X(n - 1).toFixed(1)} ${H1}L${X(0).toFixed(1)} ${H1}Z`; svg += `<path d="${area}" fill="var(--price)" opacity=".18"/><path d="${path}" fill="none" stroke="var(--price)" stroke-width="2" stroke-linejoin="round"/>`; }
  svg += `<text class="lbl" x="${L + 2}" y="12">€/${u}</text><text class="ax" x="${W - 4}" y="${PY(pmax) + 4}" text-anchor="end">${fmt(pmax, 3)}</text><text class="ax" x="${W - 4}" y="${PY(pmin) + 4}" text-anchor="end">${fmt(pmin, 3)}</text>`;
  svg += `<line x1="${L}" x2="${W - R + 4}" y1="${H1 + G / 2}" y2="${H1 + G / 2}" stroke="var(--line)"/>`;
  const top2 = H1 + G, bot2 = top2 + H2;
  if (cv2.length){
    const avg = st.l100 || cv2.reduce((a, b) => a + b, 0) / cv2.length;
    let lo = Math.min(...cv2), hi = Math.max(...cv2); const pad2 = (hi - lo) * .15 || hi * .1 || 1; lo = Math.max(0, lo - pad2); hi += pad2 * .5;
    const CY = y => top2 + 14 + (1 - (y - lo) / (hi - lo)) * (H2 - 16);
    const bw = Math.max(2, Math.min(14, pw / n * .62));
    cons.forEach((c, i) => { if (c == null) return; const y = CY(c); svg += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${(bot2 - y).toFixed(1)}" rx="1.5" fill="var(--bar)"/>`; });
    // media mobile su 5 pieni
    const idx = cons.map((c, i) => c == null ? null : i).filter(i => i != null);
    let mm = '';
    idx.forEach((i, k) => { const w = idx.slice(Math.max(0, k - 4), k + 1).map(j => cons[j]); const m = w.reduce((a, b) => a + b, 0) / w.length; mm += (mm ? 'L' : 'M') + X(i).toFixed(1) + ' ' + CY(m).toFixed(1); });

/* ================= CSV e backup ================= */
const COLS = ['tipo', 'veicolo', 'carburante', 'data', 'km', 'litri', 'prezzo_unitario', 'totale', 'pieno', 'salto_precedente', 'descrizione', 'dettagli', 'categoria', 'fatto', 'importo', 'scadenza_data', 'scadenza_km', 'ripeti_mesi', 'ripeti_km', 'data_fine', 'km_fine', 'luogo', 'nota', 'id'];
const cNum = (v, d) => v == null || !isFinite(v) ? '' : String(Math.round(v * 10 ** d) / 10 ** d).replace('.', ',');
const cStr = s => { s = String(s ?? ''); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function esportaCSV(){
  const nomeV = id => (S.veicoli.find(v => v.id === id) || {}).nome || '';
  const righe = [COLS.join(';')];
  const put = o => righe.push(COLS.map(c => cStr(o[c])).join(';'));
  S.rif.slice().sort((a, b) => a.data.localeCompare(b.data)).forEach(r => put({tipo:'rifornimento', veicolo:nomeV(r.v), carburante:tipoRif(r, veicolo(r.v)), data:r.data, km:r.km ?? '', litri:cNum(r.litri, 3), prezzo_unitario:cNum(r.prezzo, 3), totale:cNum(r.totale, 2), pieno:r.pieno ? 'si' : 'no', salto_precedente:r.mancato ? 'si' : 'no', luogo:r.luogo, nota:r.nota, id:r.id}));
  S.spese.slice().sort((a, b) => (a.data || '9999').localeCompare(b.data || '9999')).forEach(s => put({tipo: tipoVoce(s), veicolo:nomeV(s.v), data:s.data || '', km:s.km || '', descrizione:s.titolo, dettagli:s.dettagli || '', fatto: s.fatto === false ? 'no' : 'si', importo:cNum(s.importo, 2), scadenza_data: s.scad && s.scad.data || '', scadenza_km: s.scad && s.scad.km || '', ripeti_mesi:s.rip && s.rip.mesi || '', ripeti_km:s.rip && s.rip.km || '', nota:s.nota, id:s.id}));
  S.viaggi.slice().sort((a, b) => a.dal.localeCompare(b.dal)).forEach(t => put({tipo:'viaggio', veicolo:nomeV(t.v), data:t.dal, km:t.km0 || '', descrizione:t.nome, categoria:t.tipo, data_fine:t.al || '', km_fine:t.km1 || '', nota:t.nota, id:t.id}));
  daiFile(`garage-${today()}.csv`, '﻿' + righe.join('\r\n'), 'text/csv');
}
function parseCSV(txt){
  txt = txt.replace(/^﻿/, '');
  const first = txt.split(/\r?\n/)[0]; const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < txt.length; i++){
    const c = txt[i];
    if (q){ if (c === '"'){ if (txt[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === sep){ row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r'){ if (c === '\r' && txt[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
// accetta date 2026-09-16 oppure 16/09/2026
const cData = s => { s = String(s || '').trim(); let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`; m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad(+m[2])}-${pad(+m[1])}`; return null; };
function importaCSV(txt){
  const rows = parseCSV(txt); if (rows.length < 2) throw new Error('Il file è vuoto');
  const h = rows[0].map(x => x.trim().toLowerCase());
  const ix = c => h.indexOf(c); if (ix('tipo') < 0 || ix('data') < 0) throw new Error('Mancano le colonne "tipo" e "data": usa un CSV esportato da Garage');
  const g = (r, c) => { const i = ix(c); return i < 0 ? '' : (r[i] || '').trim(); };
  let n = 0, salt = 0;
  const veicolo = nome => {
    nome = nome || (V() ? V().nome : 'La mia auto');
    let v = S.veicoli.find(x => x.nome.toLowerCase() === nome.toLowerCase());
    if (!v){ v = {id:newId(), nome, modello:'', targa:'', carburante:'Benzina', serbatoio:null, colore:COLORI[S.veicoli.length % COLORI.length], nota:''}; S.veicoli.push(v); if (!S.attivo) S.attivo = v.id; }
    return v.id;
  };
  const upsert = (arr, o) => { const i = arr.findIndex(x => x.id === o.id); if (i >= 0) arr[i] = o; else arr.push(o); n++; };
  rows.slice(1).forEach(r => {
    const tipo = g(r, 'tipo').toLowerCase(), data = cData(g(r, 'data'));
    const daFare = /^n/i.test(g(r, 'fatto'));
    if (!data && !(daFare && (tipo.startsWith('man') || tipo.startsWith('doc')))){ salt++; return; }
    const id = g(r, 'id') || newId(), v = veicolo(g(r, 'veicolo')), km = num(g(r, 'km'), true);
    if (tipo.startsWith('rif')){
      const litri = num(g(r, 'litri')), tot = num(g(r, 'totale')), pr = num(g(r, 'prezzo_unitario'));
      if (!(litri > 0) || !(tot > 0 || pr > 0)){ salt++; return; }
      upsert(S.rif, {id, v, data, km: km >= 0 ? km : null, carb: g(r, 'carburante') || undefined, litri, prezzo: pr > 0 ? pr : tot / litri, totale: tot > 0 ? tot : litri * pr, pieno: !/^n/i.test(g(r, 'pieno')), mancato: /^s/i.test(g(r, 'salto_precedente')), luogo:g(r, 'luogo'), nota:g(r, 'nota')});
    } else if (tipo.startsWith('spes') || tipo.startsWith('man') || tipo.startsWith('doc')){
      const mesi = num(g(r, 'ripeti_mesi'), true), rkm = num(g(r, 'ripeti_km'), true), sd = cData(g(r, 'scadenza_data')), sk = num(g(r, 'scadenza_km'), true);
      const t = tipo.startsWith('doc') || DOC_CAT.includes(g(r, 'categoria').toLowerCase()) ? 'documenti' : 'manutenzione';
      upsert(S.spese, {id, v, tipo:t, titolo:g(r, 'descrizione') || 'Manutenzione', dettagli:g(r, 'dettagli'), fatto:!daFare, data: daFare ? null : data, km: !daFare && km > 0 ? km : null, importo: num(g(r, 'importo')) || 0, nota:g(r, 'nota'),
        scad: sd || sk > 0 ? {data: sd || null, km: sk > 0 ? sk : null} : null, rip: mesi > 0 || rkm > 0 ? {mesi: mesi > 0 ? mesi : null, km: rkm > 0 ? rkm : null} : null});
    } else if (tipo.startsWith('viag')){
      const km1 = num(g(r, 'km_fine'), true);
      upsert(S.viaggi, {id, v, nome:g(r, 'descrizione') || 'Viaggio', tipo: TIPI_VIAGGIO.includes(g(r, 'categoria')) ? g(r, 'categoria') : 'Altro', dal:data, al:cData(g(r, 'data_fine')) || '', km0: km > 0 ? km : null, km1: km1 > 0 ? km1 : null, nota:g(r, 'nota')});
    } else salt++;
  });
  save();
  return `Importate ${n} righe` + (salt ? `, ${salt} saltate` : '');
}
let attesa = null;
function scegliFile(tipo){ attesa = tipo; const f = $('#fileIn'); f.value = ''; f.click(); }
$('#fileIn').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  const txt = await file.text();
  try {
    if (attesa === 'json' || /^\s*\{/.test(txt)){
      const d = JSON.parse(txt);
      if (!d || !Array.isArray(d.veicoli)) throw new Error('Non è un backup di Garage');
      S = {...vuoto(), veicoli:d.veicoli, attivo:d.attivo, rif:d.rif || [], spese:d.spese || [], viaggi:d.viaggi || [], tema:S.tema, ultimoBackup:d.ultimoBackup || null};
      save(); flash(`Backup ripristinato: ${S.veicoli.length} veicoli`);
    } else flash(importaCSV(txt));
  } catch(err){ flash('Impossibile leggere il file: ' + err.message); }
  show(tab);
};
async function daiFile(nome, testo, mime){
  const blob = new Blob([testo], {type:mime});
  try {
    const file = new File([blob], nome, {type:mime});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:nome}); return true; }
  } catch(e){ if (e && e.name === 'AbortError') return false; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = nome; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  flash('File scaricato: ' + nome);
  return true;
}
async function backup(){
  if (await daiFile(`garage-backup-${today()}.json`, JSON.stringify({app:'garage', versione:1, ...S}, pulito, 1), 'application/json')){ S.ultimoBackup = today(); save(); render(); }
}

  S.veicoli.push(v); S.attivo = v.id;
  let km = 61200, d = addMonths(today(), -20); let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  let prezzo = 1.82;
  while (d < today()){
    const tratto = Math.round(380 + rnd() * 190); km += tratto;
    prezzo = Math.max(1.66, Math.min(2.02, prezzo + (rnd() - .5) * .05));
    const pieno = rnd() > .1, l = tratto * (5.6 + rnd() * 1.4) / 100 * (pieno ? 1 : .55);
    S.rif.push({id:newId(), v:v.id, data:d, km, litri:Math.round(l * 100) / 100, prezzo:Math.round(prezzo * 1000) / 1000, totale:Math.round(l * prezzo * 100) / 100, pieno, mancato:false, luogo:['Eni', 'Q8', 'IP', 'Tamoil'][Math.floor(rnd() * 4)], nota:''});
    d = addDays(d, 9 + Math.floor(rnd() * 9));
  }
  const kmAl = data => { const f = S.rif.filter(r => r.data <= data).pop(); return f ? f.km : 61200; };
  const sp = (mesiFa, titolo, cat, importo, luogo, rip) => { const data = addMonths(today(), -mesiFa); S.spese.push({id:newId(), v:v.id, tipo: DOC_CAT.includes(cat) ? 'documenti' : 'manutenzione', fatto:true, data, km:kmAl(data), titolo, dettagli: titolo === 'Tagliando' ? 'olio 5W-40, filtro olio e aria' : '', importo, nota:'', rip}); };

  sp(13, 'Assicurazione', 'assicurazione', 480, 'Compagnia', null);
  sp(1, 'Assicurazione', 'assicurazione', 455, 'Compagnia', {mesi:12, km:null});
  sp(17, 'Bollo', 'bollo', 162, 'ACI', {mesi:12, km:null});
  sp(14, 'Gomme invernali', 'gomme', 360, 'Gommista', null);
  sp(7, 'Tagliando', 'manutenzione', 235, 'Officina Rossi', {mesi:12, km:15000});
  sp(11, 'Revisione', 'revisione', 79, 'Centro revisioni', {mesi:24, km:null});
  sp(3, 'Lavaggio', 'lavaggio', 15, 'Autolavaggio', null);
  S.spese.push({id:newId(), v:v.id, tipo:'manutenzione', fatto:false, data:null, km:null, titolo:'Pastiglie freni', dettagli:'anteriori', importo:0, nota:'', rip:null, scad:{data:addDays(today(), 20), km:null}});
  const v0 = addMonths(today(), -2);
  S.viaggi.push({id:newId(), v:v.id, nome:'Vacanze in Puglia', tipo:'Vacanza', dal:v0, al:addDays(v0, 9), km0:kmAl(v0), km1:kmAl(addDays(v0, 10)), nota:''});
  const y0 = today().slice(0, 4) + '-01-01';
  S.viaggi.push({id:newId(), v:v.id, nome:'Anno ' + today().slice(0, 4), tipo:'Periodo', dal:y0, al:'', km0:kmAl(y0), km1:null, nota:''});
  save();
}


/* ================= importa da link (?importa=...) ================= */
function leggiLink(testo){
  let raw = null;
  if (testo != null){ const m = String(testo).match(/importa=([A-Za-z0-9_\-]+)/); raw = m ? m[1] : String(testo).trim().replace(/\s/g, ''); }
  else try { raw = new URLSearchParams(location.search).get('importa'); } catch(e){}
  if (!raw) return null;
  try {
    const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
    const d = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))));
    if (!d || !d.veicolo || !Array.isArray(d.rif)) throw new Error('formato');
    return d;
  } catch(e){ flash('Il link di importazione non è valido'); return null; }
}
function incollaLink(){
  openSheet('Importa da un link', `<p class="say">Copia il link che ti ho mandato (tieni premuto sul link → Copia) e incollalo qui sotto.</p>
    <textarea class="input" id="lnk" rows="5" placeholder="https://makatosin.github.io/Garage/?importa=..." style="font-size:14px;resize:vertical"></textarea>
    <button class="btn btn-primary" id="lnkGo" type="button">Continua</button>`, null);
  $('#lnkGo').onclick = () => { const d = leggiLink(val('lnk')); if (d) importaDaLink(d); };
}
function pulisciLink(){ try { history.replaceState(null, '', location.pathname + location.hash); } catch(e){} }
function importaDaLink(d){
  const dv = d.veicolo;
  const esempio = S.veicoli.filter(v => /^Esempio/.test(v.nota || ''));
  const veri = S.veicoli.filter(v => !esempio.includes(v));
  const perNome = S.veicoli.find(v => v.nome.trim().toLowerCase() === String(dv.nome).trim().toLowerCase());
  const scelto = perNome ? perNome.id : veri.length === 1 ? veri[0].id : 'nuovo';
  const opzioni = [['nuovo', 'Nuova auto: ' + dv.nome], ...S.veicoli.map(v => [v.id, 'Aggiungi a: ' + v.nome])];
  const tot = d.rif.reduce((a, r) => a + (r.totale || 0), 0);
  const html = `<p class="say">Sto per aggiungere questi dati:</p>
    <div class="kv">
      <div><span>auto</span><b style="font-family:var(--f-body)">${esc(dv.nome)}<small>${esc([dv.modello, dv.carburante, dv.serbatoio ? 'serbatoio ' + fmt(dv.serbatoio) + ' l' : ''].filter(Boolean).join(' · '))}</small></b></div>
      ${dv.lettura ? `<div><span>contachilometri</span><b>${fmt(dv.lettura.km)} km<small>al ${fDate(dv.lettura.data)}</small></b></div>` : ''}
      <div><span>rifornimenti</span><b>${d.rif.length} · ${eur(tot)}<small>${d.rif.map(r => fShort(r.data) + ' ' + eur(r.totale)).join(' · ')}</small></b></div>
    </div>
    ${d.nota ? `<p class="hint">${esc(d.nota)}</p>` : ''}
    ${select('impV', 'Dove li metto', opzioni, scelto, true)}
    <label class="check" id="impSostL"><input type="checkbox" id="impSost"><span id="impSostT"></span></label>
    ${esempio.length ? `<label class="check"><input type="checkbox" id="impEs" checked><span>Elimina l'auto di esempio (${esc(esempio.map(v => v.nome).join(', '))})</span></label>` : ''}
    <button class="btn btn-primary" id="impGo" type="button">Importa</button>`;
  openSheet('Importa dati', html, null);
  const agg = () => { const id = val('impV'), n = S.rif.filter(r => r.v === id).length; $('#impSostL').hidden = !n; $('#impSostT').textContent = `Cancella prima i ${n} rifornimenti già presenti in questa auto (consigliato se li hai inseriti per prova)`; };
  $('#impV').onchange = agg; agg();
  $('#impGo').onclick = () => {
    let id = val('impV'), v;
    if (id === 'nuovo'){
      v = {id:newId(), nome:dv.nome, modello:dv.modello || '', targa:'', carburante:dv.carburante || 'Benzina', serbatoio:dv.serbatoio || null, colore:COLORI[S.veicoli.length % COLORI.length], nota:''};
      S.veicoli.push(v);
    } else {
      v = veicolo(id);
      Object.assign(v, {carburante:dv.carburante || v.carburante, serbatoio:dv.serbatoio || v.serbatoio, modello:v.modello || dv.modello || ''});
      if ($('#impSost') && $('#impSost').checked) S.rif = S.rif.filter(r => r.v !== v.id);
    }
    v.prezziRif = {...(v.prezziRif || {}), ...(dv.prezziRif || {})};
    if (dv.lettura && dv.lettura.km > kmAttuali(v.id)) v.lettura = dv.lettura;
    let n = 0;
    d.rif.forEach(r => { if (!S.rif.some(x => x.id === r.id)){ S.rif.push({pieno:true, mancato:false, luogo:'', nota:'', ...r, v:v.id}); n++; } });
    if ($('#impEs') && $('#impEs').checked){
      const ids = esempio.filter(x => x.id !== v.id).map(x => x.id);
      S.veicoli = S.veicoli.filter(x => !ids.includes(x.id)); S.rif = S.rif.filter(x => !ids.includes(x.v)); S.spese = S.spese.filter(x => !ids.includes(x.v)); S.viaggi = S.viaggi.filter(x => !ids.includes(x.v));
    }
    S.attivo = v.id; save(); pulisciLink(); closeSheet(); show('carb'); flash(`Importati ${n} rifornimenti in ${v.nome}`);
  };
  sheet.addEventListener('close', pulisciLink, {once:true});
}
